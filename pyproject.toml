[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstate"
version = "0.1.0"
description = "Grades a travel-rebooking support agent by the booking database it leaves behind, not its transcript, and reports pass^k reliability."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "endstate contributors" }]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
endstate = "endstate.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/endstate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]
markers = ["live: calls a real model endpoint; needs ENDSTATE_LIVE=1"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
